services:
  - type: web
    name: xeno-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: xeno-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: xeno-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: xeno-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: xeno-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: xeno-db
          property: password
      - key: SHOPIFY_API_KEY
        value: f7cfb779814c24044017afd6ed6d9913
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: static_site
    name: xeno-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://xeno-backend.onrender.com/api

databases:
  - name: xeno-db
    databaseName: xeno_assignment
    user: xeno_user
    region: oregon
